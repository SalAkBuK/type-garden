<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Type Garden</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    a { color: #fff; text-decoration: none; }
    a:hover { color: #FFB4A8; }
    input[type=range] { accent-color: #FFFFFF; }

    [data-tg="app"] {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    [data-tg="app"] button {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    html[data-touch] [data-tg="app"] {
      touch-action: none;
      top: var(--tg-top, 0px) !important;
      bottom: auto !important;
      height: var(--tg-h, 100%) !important;
    }
    [data-tg="modes"] {
      position: absolute;
      top: calc(16px + env(safe-area-inset-top)) !important;
      right: calc(16px + env(safe-area-inset-right)) !important;
      z-index: 25;
      display: flex;
      gap: 4px;
      padding: 4px;
      border: 1px solid #2A2A2A;
      border-radius: 999px;
      background: #000;
    }
    [data-tg="treatment"] {
      position: absolute;
      top: calc(16px + env(safe-area-inset-top)) !important;
      left: calc(16px + env(safe-area-inset-left)) !important;
      z-index: 25;
      display: flex;
      gap: 4px;
      padding: 4px;
      border: 1px solid #2A2A2A;
      border-radius: 999px;
      background: #000;
    }
    [data-tg="treatment"] button {
      border: 0;
      border-radius: 999px;
      padding: 7px 14px;
      font: inherit;
      font-size: 12px;
      letter-spacing: 0.04em;
      cursor: pointer;
      background: transparent;
      color: #BDBDBD;
      transition: background 0.15s ease, color 0.15s ease;
      touch-action: manipulation;
    }
    [data-tg="treatment"] button:hover {
      color: #FFFFFF;
    }
    [data-tg="treatment"] button[data-active="true"] {
      background: #FFFFFF;
      color: #000000;
      font-weight: 500;
    }
    [data-tg="bar"] {
      position: absolute;
      left: calc(24px + env(safe-area-inset-left)) !important;
      right: calc(24px + env(safe-area-inset-right)) !important;
      bottom: calc(20px + env(safe-area-inset-bottom)) !important;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 12px;
      letter-spacing: 0.04em;
      transition: color 0.2s ease, opacity 0.2s ease;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
    }
    [data-tg="hints"] {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }
    [data-tg="ctrls"] {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    [data-tg="pal"] {
      display: flex;
      gap: 6px;
      align-items: center;
      padding: 4px 6px;
      border: 1px solid #3A3A3A;
      border-radius: 999px;
      transition: background-color 0.25s ease;
    }
    [data-tg="sw"] {
      --sw: 22px;
      width: var(--sw);
      height: var(--sw);
      padding: 0;
      border-radius: 999px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    [data-tg="sw"]:hover {
      transform: scale(1.18) !important;
    }
    [data-tg="dot"] {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      pointer-events: none;
    }
    [data-tg="btn"] {
      background: transparent;
      border: 1px solid #3A3A3A;
      color: #BDBDBD;
      font: inherit;
      font-size: 12px;
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: border-color 0.15s ease, color 0.15s ease;
    }
    [data-tg="btn"]:hover {
      border-color: #FFFFFF;
      color: #FFFFFF;
    }
    [data-tg="coarse"] { display: none; }
    @media (pointer: coarse) {
      [data-tg="fine"] { display: none; }
      [data-tg="coarse"] { display: inline; }
    }
    @media (max-width: 600px) {
      [data-tg="treatment"] {
        top: calc(10px + env(safe-area-inset-top)) !important;
        left: calc(10px + env(safe-area-inset-left)) !important;
        gap: 2px !important;
        padding: 3px !important;
      }
      [data-tg="treatment"] button {
        padding: 5px 8px !important;
        font-size: 11px !important;
      }
      [data-tg="modes"] {
        top: calc(10px + env(safe-area-inset-top)) !important;
        right: calc(10px + env(safe-area-inset-right)) !important;
        padding: 3px !important;
      }
      [data-tg="modes"] button {
        padding: 5px 8px !important;
        font-size: 11px !important;
      }
      [data-tg="bar"] {
        left: calc(16px + env(safe-area-inset-left)) !important;
        right: calc(16px + env(safe-area-inset-right)) !important;
        bottom: calc(14px + env(safe-area-inset-bottom)) !important;
        gap: 10px !important;
      }
      [data-tg="hints"] { gap: 12px !important; font-size: 11px; }
      [data-tg="ctrls"] { flex: 1 1 100%; justify-content: space-between; gap: 8px !important; }
      [data-tg="pal"] { gap: 4px !important; }
      [data-tg="sw"] {
        --sw: clamp(13px, calc((100vw - 183px) / 10), 22px);
        width: var(--sw) !important;
        height: var(--sw) !important;
      }
      [data-tg="dot"] {
        width: calc(var(--sw) * .46) !important;
        height: calc(var(--sw) * .46) !important;
      }
      [data-tg="btn"] { padding: 7px 11px !important; font-size: 11px; }
    }
    @media (max-width: 720px) {
      [data-tg="poster"] {
        display: flex !important;
        flex-direction: column;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-y;
      }
      [data-tg="poster"]::before {
        content: "";
        order: -2;
        position: sticky;
        top: 0;
        flex: none;
        height: calc(60px + env(safe-area-inset-top));
        margin-bottom: calc(-60px - env(safe-area-inset-top));
        background: linear-gradient(#000 62%, rgba(0,0,0,0));
        z-index: 4;
        pointer-events: none;
      }
      [data-tg="stage"] {
        order: -1;
        flex: none;
        padding: calc(64px + env(safe-area-inset-top)) 16px 12px !important;
      }
      [data-tg="pcanvas"] { width: 100% !important; max-width: 520px; }
      [data-tg="panel"] {
        flex: none;
        border-right: 0 !important;
        border-top: 1px solid #1E1E1E;
        overflow: visible !important;
        padding: 20px 16px calc(32px + env(safe-area-inset-bottom)) !important;
      }
    }
  </style>
</head>
<body>
  <div id="tg-app" data-tg="app" style="position:fixed;inset:0;background:#000;cursor:text;font-family:'DM Mono',ui-monospace,monospace">
    <!-- Typing View Canvas -->
    <canvas id="tg-canvas" style="position:absolute;inset:0;width:100%;height:100%;display:block"></canvas>
    
    <!-- Hidden input for typing and mobile IME -->
    <input id="tg-input" data-tg="input" aria-label="Type to grow a garden" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" style="position:fixed;left:0;top:0;width:1px;height:1px;margin:0;padding:0;border:0;opacity:0;font-size:16px;color:transparent;background:transparent;caret-color:transparent;pointer-events:none">

    <!-- Botanical Treatment Comparison Switcher -->
    <div data-tg="treatment" id="tg-treatment-bar">
      <button id="btn-treat-split" data-treatment="split" data-active="true" style="background:#FFFFFF;color:#000000;font-weight:500">Split View</button>
      <button id="btn-treat-custom" data-treatment="customized" data-active="false">Customized</button>
      <button id="btn-treat-baseline" data-treatment="baseline" data-active="false">Baseline</button>
    </div>

    <!-- Mode Switcher (Type / Poster) -->
    <div data-tg="modes">
      <button id="btn-mode-type" style="border:0;border-radius:999px;padding:7px 14px;font:inherit;font-size:12px;letter-spacing:0.04em;cursor:pointer;background:#FFFFFF;color:#000000;font-weight:500">Type</button>
      <button id="btn-mode-poster" style="border:0;border-radius:999px;padding:7px 14px;font:inherit;font-size:12px;letter-spacing:0.04em;cursor:pointer;background:transparent;color:#BDBDBD">Poster</button>
    </div>

    <!-- Type Mode Bottom Hints & Controls Bar -->
    <div id="tg-bar" data-tg="bar" style="color:#FFFFFF;opacity:0.65">
      <div data-tg="hints">
        <span data-tg="fine">type to grow</span><span data-tg="coarse">tap to type</span>
        <span>space cuts</span>
        <span data-tg="fine">backspace withers</span><span data-tg="coarse">⌫ withers</span>
        <span data-tg="fine">enter clears</span><span data-tg="coarse">return clears</span>
        <span data-tg="fine">tab: compare</span><span data-tg="coarse">tap compare</span>
      </div>
      <div data-tg="ctrls">
        <div id="tg-pal-bar" data-tg="pal" style="background:#000000"></div>
        <button id="btn-save-png" data-tg="btn">PNG</button>
        <button id="btn-save-svg" data-tg="btn">SVG</button>
      </div>
    </div>

    <!-- Poster View -->
    <div id="tg-poster" data-tg="poster" style="position:absolute;inset:0;display:none;grid-template-columns:minmax(280px,340px) minmax(0,1fr);background:#000;cursor:default;color:#EDEDED;font-size:12px;letter-spacing:0.03em;z-index:10">
      <div data-tg="panel" style="border-right:1px solid #1E1E1E;overflow-y:auto;overflow-x:hidden;padding:24px 22px 32px;display:flex;flex-direction:column;gap:26px;background:#0A0A0A">
        <div style="display:flex;flex-direction:column;gap:4px">
          <div style="font-family:'Playfair Display',serif;font-weight:700;font-size:26px;letter-spacing:0;color:#FFFFFF">Poster</div>
          <div id="poster-info-label" style="color:#8C8C8C">1080 × 1080 loop · 3s</div>
        </div>

        <div style="display:flex;flex-direction:column;gap:10px">
          <div style="color:#8C8C8C;text-transform:uppercase;font-size:11px;letter-spacing:0.08em">Words</div>
          <input id="poster-text-input" value="in bloom" spellcheck="false" style="background:#000;border:1px solid #2A2A2A;border-radius:10px;color:#FFFFFF;font-family:'Playfair Display',serif;font-weight:700;font-size:22px;padding:10px 12px;outline:none" onfocus="this.style.borderColor='#FFFFFF'" onblur="this.style.borderColor='#2A2A2A'">
          <button id="btn-reshuffle" style="align-self:flex-start;background:transparent;border:1px solid #2A2A2A;color:#EDEDED;font:inherit;padding:8px 12px;border-radius:999px;cursor:pointer" onmouseenter="this.style.borderColor='#FFFFFF'" onmouseleave="this.style.borderColor='#2A2A2A'">Regrow garden</button>
        </div>

        <div style="display:flex;flex-direction:column;gap:10px">
          <div style="color:#8C8C8C;text-transform:uppercase;font-size:11px;letter-spacing:0.08em">Motion</div>
          <div id="poster-presets-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"></div>
        </div>

        <div style="display:flex;flex-direction:column;gap:10px">
          <div style="color:#8C8C8C;text-transform:uppercase;font-size:11px;letter-spacing:0.08em">Treatment</div>
          <div id="poster-treatment-grid" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px">
            <button id="pbtn-treat-split" style="background:#1E1E1E;border:1px solid #FFFFFF;color:#FFFFFF;font:inherit;font-size:11px;padding:8px 6px;border-radius:8px;cursor:pointer">Split View</button>
            <button id="pbtn-treat-custom" style="background:transparent;border:1px solid #2A2A2A;color:#8C8C8C;font:inherit;font-size:11px;padding:8px 6px;border-radius:8px;cursor:pointer">Customized</button>
            <button id="pbtn-treat-baseline" style="background:transparent;border:1px solid #2A2A2A;color:#8C8C8C;font:inherit;font-size:11px;padding:8px 6px;border-radius:8px;cursor:pointer">Baseline</button>
          </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:10px">
          <div style="color:#8C8C8C;text-transform:uppercase;font-size:11px;letter-spacing:0.08em">Palette</div>
          <div id="poster-palettes-grid" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px"></div>
        </div>

        <div style="display:flex;flex-direction:column;gap:10px;border-top:1px solid #1E1E1E;padding-top:20px">
          <div style="color:#8C8C8C;text-transform:uppercase;font-size:11px;letter-spacing:0.08em">Export · 1080 × 1080 loop</div>
          <button id="btn-export-video" style="background:#FFFFFF;border:0;color:#000;font:inherit;font-weight:500;padding:12px 14px;border-radius:999px;cursor:pointer">Export Video</button>
          <button id="btn-export-frames" style="background:transparent;border:1px solid #3A3A3A;color:#EDEDED;font:inherit;padding:11px 14px;border-radius:999px;cursor:pointer" onmouseenter="this.style.borderColor='#FFFFFF'" onmouseleave="this.style.borderColor='#3A3A3A'">PNG frames (.zip)</button>
          <div id="poster-status" style="color:#8C8C8C;min-height:16px;font-size:11px"></div>
        </div>
      </div>

      <div data-tg="stage" style="display:flex;align-items:center;justify-content:center;padding:56px 32px 32px;min-width:0">
        <canvas id="tg-pcanvas" data-tg="pcanvas" width="1080" height="1080" style="width:min(100%, calc(100vh - 96px));height:auto;aspect-ratio:1 / 1;display:block;border:1px solid #1E1E1E"></canvas>
      </div>
    </div>
  </div>

  <script>
  (function() {
    'use strict';

    class TypeGardenApp {
      constructor() {
        this.appEl = document.getElementById('tg-app');
        this.cv = document.getElementById('tg-canvas');
        this.inp = document.getElementById('tg-input');
        this.pcv = document.getElementById('tg-pcanvas');
        this.posterEl = document.getElementById('tg-poster');
        this.barEl = document.getElementById('tg-bar');
        this.palBarEl = document.getElementById('tg-pal-bar');
        this.btnType = document.getElementById('btn-mode-type');
        this.btnPoster = document.getElementById('btn-mode-poster');
        this.pTextInput = document.getElementById('poster-text-input');
        this.btnReshuffle = document.getElementById('btn-reshuffle');
        this.presetsGrid = document.getElementById('poster-presets-grid');
        this.palettesGrid = document.getElementById('poster-palettes-grid');
        this.infoLabel = document.getElementById('poster-info-label');
        this.btnExportVideo = document.getElementById('btn-export-video');
        this.btnExportFrames = document.getElementById('btn-export-frames');
        this.statusEl = document.getElementById('poster-status');

        this.SENT = String.fromCharCode(0x200b); // Zero-width space sentinel
        this.F = '"Playfair Display",Georgia,serif';
        this.C = { red: '#FF1400', blue: '#3257FF', line: '#FFB4A8', text: '#FFFFFF', vein: '#000000' };

        this.PRESETS = [
          { id: 'breathe', label: 'Breathe', sub: 'Slow sway · 3s', T: 3000 },
          { id: 'grow', label: 'Grow & wither', sub: 'Bloom, then back · 6s', T: 6000 },
          { id: 'typed', label: 'Typed', sub: 'Type, cut, repeat · 5s', T: 5000 },
          { id: 'wind', label: 'Gust', sub: 'Wind sweeps through · 4s', T: 4000 },
          { id: 'reach', label: 'Reach', sub: 'Stems follow a light · 6s', T: 6000 },
          { id: 'scatter', label: 'Scatter', sub: 'Random bloom, fade · 6s', T: 6000 },
          { id: 'visit', label: 'Visitor', sub: 'Butterfly drops by · 7s', T: 7000 }
        ];

        // name, background, flower, stem & leaf, flower line, type
        this.PAL = [
          ['Rose noir', '#000000', '#FF1400', '#3257FF', '#FFB4A8', '#FFFFFF'],
          ['Paper', '#F3EEE4', '#FF3B1F', '#1C2B8F', '#FFD2C4', '#111111'],
          ['Midnight', '#0D1B4C', '#FF5A4E', '#9FB4FF', '#FFD6CF', '#FFFFFF'],
          ['Citrus', '#0E1A12', '#FF8A00', '#1FA463', '#FFE2B8', '#FFF6E8'],
          ['Orchid', '#140A1F', '#E63CFF', '#2FB8A6', '#F9D1FF', '#FFFFFF'],
          ['Moss', '#133A2A', '#FFB7C5', '#7FD18B', '#FFFFFF', '#F6F1E7'],
          ['Tomato', '#FF1400', '#FFF1E0', '#0B0B0B', '#FF1400', '#000000'],
          ['Butter', '#FFE9A8', '#E4002B', '#0F5132', '#FFC2C2', '#1A1A1A'],
          ['Blush', '#FAD4D8', '#C8102E', '#274690', '#FFE3E6', '#1A1A1A'],
          ['Mono', '#000000', '#F2F2F2', '#6E6E6E', '#000000', '#FFFFFF']
        ];

        this.props = { boil: true, recoil: 20, density: 1, showHint: true };
        this.splitPos = 0.5;
        this.isDraggingSplit = false;
        this.state = {
          mode: 'type',
          treatment: 'split', // 'split' | 'customized' | 'baseline'
          preset: 'breathe',
          palette: 0,
          text: 'in bloom',
          seed: 7,
          status: '',
          busy: false
        };

        this.init();
      }

      init() {
        this.letters = [];
        this.uid = 1;
        this.cache = {};
        this.Sd = 0;
        this.St = 0;
        this.wrapped = false;
        this.t0 = performance.now();
        this.lastKey = 0;
        this.rand = Math.random;
        this.g = this.cv.getContext('2d');
        this.fa = {};
        this.mx = null;
        this.my = null;
        this.flies = [];
        this.perch = [];

        // Determine video export MIME
        this.vmime = typeof MediaRecorder !== 'undefined'
          ? ['video/mp4;codecs=avc1.42E01E', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'].find(m => {
              try { return MediaRecorder.isTypeSupported(m); } catch(e) { return false; }
            })
          : null;
        this.btnExportVideo.textContent = this.vmime && this.vmime.includes('mp4') ? 'Export MP4' : 'Export WebM';

        // Touch & mobile visual viewport
        this.touch = !!(typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
        if (this.touch) document.documentElement.setAttribute('data-touch', '');
        this.ptype = 'mouse';
        window.addEventListener('pointerdown', e => {
          this.ptype = e.pointerType || 'mouse';
          if (this.state.treatment === 'split') {
            if (this.state.mode === 'type' && this.W) {
              const splitX = this.W * this.splitPos;
              if (Math.abs(e.clientX - splitX) <= 24) {
                this.isDraggingSplit = true;
                e.preventDefault();
              }
            } else if (this.state.mode === 'poster' && this.pcv) {
              const rect = this.pcv.getBoundingClientRect();
              const pSplitX = rect.left + rect.width * this.splitPos;
              if (Math.abs(e.clientX - pSplitX) <= 24 && e.clientY >= rect.top && e.clientY <= rect.bottom) {
                this.isDraggingSplit = true;
                e.preventDefault();
              }
            }
          }
        }, true);
        window.addEventListener('pointerup', e => {
          if (e.pointerType && e.pointerType !== 'mouse') this.mx = null;
          this.isDraggingSplit = false;
          document.body.style.cursor = '';
        });
        window.addEventListener('pointercancel', e => {
          if (e.pointerType && e.pointerType !== 'mouse') this.mx = null;
          this.isDraggingSplit = false;
          document.body.style.cursor = '';
        });

        this.onResize = () => this.resize();
        window.addEventListener('resize', this.onResize);
        this.resize();

        // Keyboard listener
        this.onKey = e => this.key(e);
        window.addEventListener('keydown', this.onKey);

        // Pointer move & split dragging
        this.onMove = e => {
          this.mx = e.clientX;
          this.my = e.clientY;
          if (this.isDraggingSplit) {
            document.body.style.cursor = 'col-resize';
            if (this.state.mode === 'type' && this.W) {
              this.splitPos = Math.max(0.08, Math.min(0.92, e.clientX / this.W));
            } else if (this.state.mode === 'poster' && this.pcv) {
              const rect = this.pcv.getBoundingClientRect();
              const norm = (e.clientX - rect.left) / rect.width;
              this.splitPos = Math.max(0.08, Math.min(0.92, norm));
            }
          } else if (this.state.treatment === 'split' && this.state.mode === 'type' && this.W) {
            const splitX = this.W * this.splitPos;
            if (Math.abs(e.clientX - splitX) <= 20) {
              this.cv.style.cursor = 'col-resize';
            } else {
              this.cv.style.cursor = 'text';
            }
          } else if (this.state.treatment === 'split' && this.state.mode === 'poster' && this.pcv) {
            const rect = this.pcv.getBoundingClientRect();
            const pSplitX = rect.left + rect.width * this.splitPos;
            if (Math.abs(e.clientX - pSplitX) <= 20 && e.clientY >= rect.top && e.clientY <= rect.bottom) {
              this.pcv.style.cursor = 'col-resize';
            } else {
              this.pcv.style.cursor = 'default';
            }
          }
        };
        this.onLeave = () => {
          this.mx = null;
          this.my = null;
          this.isDraggingSplit = false;
          document.body.style.cursor = '';
        };
        window.addEventListener('pointermove', this.onMove);
        document.addEventListener('pointerleave', this.onLeave);

        // Mobile input field synchronization
        const fld = this.inp;
        this.iv = this.SENT;
        if (fld) {
          fld.value = this.SENT;
          fld.addEventListener('input', () => this.inputDiff(fld));
          fld.addEventListener('compositionstart', () => { this.composing = true; });
          fld.addEventListener('compositionend', () => {
            this.composing = false;
            setTimeout(() => { if (!this.composing) this.inputDiff(fld); }, 0);
          });
        }

        // Tap on app focuses hidden input (guards against dragging split divider)
        this.appEl.addEventListener('pointerdown', e => {
          if (this.isDraggingSplit) return;
          if (e.target && (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT')) return;
          this.focus();
        });

        // Visual viewport on mobile
        this.vv = window.visualViewport || null;
        this.vvMax = 0;
        this.onVV = () => this.syncVV();

            '#8f1122',
            '#de3e53',

            R * 0.22,
            R * (0.75 + 0.06 * Math.sin(i * 3 + e.ph1)),

            '#b8162c',
            '#f06277',
            0.12,
            0.16,
            i * 1.5,

            '#ce1d37',
            '#f57b8e',

          c[0] += (tx - c[0]) * 0.07; c[1] += (ty - c[1]) * 0.07;
        }
        const f = st.boil ? Math.floor(now / 120) : 0, amp = st.boil ? Math.max(0.8, S * 0.01) : 0;
        const kd = l => l.dead ? 1 - this.eo((now - l.dead) / st.wither) : 1;

        const drawCustom = layer => {
          for (const l of L) {
            if (l.ch === ' ' || !l.els) continue;
            const age = (now - l.birth) * sp, kk = kd(l);
            const each = e => {
              if (e.t === 'stem') {
                this.drawStemCustomized(B, e, l, age, kk, st, f, amp, layer);
              } else if (e.layer === layer) {
                this.drawElCustomized(B, e, l, age, kk, st, f, amp);
              }
            };
            l.els.forEach(each);
            if (l.endEls) l.endEls.forEach(each);
            const i = act.indexOf(l), nx = i >= 0 ? act[i + 1] : null;
            if (l.tend && (l.dead || !nx || nx.ch === ' ')) {
              let fr = this.eo(((now - l.tb) * sp - 150) / 450);
              if (l.cut != null) fr *= 1 - this.eo((now - l.cut) * sp / 150) * Math.min(0.85, st.recoil / (0.6 * S));
              for (const e of l.tend) this.drawStemCustomized(B, e, l, age, kk, st, f, amp, layer, fr * kk);
            }
          }
        };

        // Layer 0: behind text glyphs
        drawCustom(0);

        // Text Glyphs: Pure white on black background, 100% readable
        for (const l of L) {
          if (l.ch !== ' ' && (st.textAll || !l.dead)) {
            B.text(l.ch, l.x, l.y, S, '#FFFFFF');
          }
        }

        // Layer 1: in front of text glyphs
        drawCustom(1);
      }

      drawSplitDivider(g, splitX, H, isPoster = false) {
        g.save();
        // Hairline vertical divider
        g.beginPath();
        g.strokeStyle = 'rgba(255, 255, 255, 0.3)';
        g.lineWidth = isPoster ? 2 : 1;
        g.moveTo(splitX, 0);
        g.lineTo(splitX, H);
        g.stroke();

        // Center pill handle with grip indicators
        const midY = H / 2;
        const hw = isPoster ? 16 : 13;
        const hh = isPoster ? 30 : 24;
        g.fillStyle = '#141414';
        g.strokeStyle = 'rgba(255, 255, 255, 0.45)';
        g.lineWidth = isPoster ? 2 : 1;
        g.beginPath();
        if (g.roundRect) g.roundRect(splitX - hw, midY - hh, hw * 2, hh * 2, hw);
        else g.rect(splitX - hw, midY - hh, hw * 2, hh * 2);
        g.fill();
        g.stroke();

        g.fillStyle = 'rgba(255, 255, 255, 0.7)';
        const dotR = isPoster ? 2 : 1.5;
        g.beginPath();
        g.arc(splitX - (isPoster ? 5 : 4), midY, dotR, 0, Math.PI * 2);
        g.arc(splitX + (isPoster ? 5 : 4), midY, dotR, 0, Math.PI * 2);
        g.fill();

        // Floating label badges
        const badgeY = isPoster ? 50 : 80;
        const fontSz = isPoster ? 14 : 11;
        g.font = `500 ${fontSz}px "DM Mono", monospace`;

        const maxW = isPoster ? 1080 : this.W;

        // Baseline badge
        const bText = 'BASELINE';
        const bMetrics = g.measureText(bText);
        const bPad = isPoster ? 10 : 7;
        const bW = bMetrics.width + bPad * 2;
        const bH = isPoster ? 28 : 22;
        let bX = splitX - bW - (isPoster ? 14 : 10);
        if (bX < 8) bX = 8;
        if (bX + bW > splitX - 2) bX = splitX - bW - 2;

        g.fillStyle = 'rgba(10, 10, 10, 0.85)';
        g.strokeStyle = '#333333';
        g.lineWidth = 1;
        g.beginPath();
        if (g.roundRect) g.roundRect(bX, badgeY - bH / 2, bW, bH, 999);
        else g.rect(bX, badgeY - bH / 2, bW, bH);
        g.fill();
        g.stroke();

        g.fillStyle = '#A0A0A0';
        g.textAlign = 'center';
        g.textBaseline = 'middle';
        g.fillText(bText, bX + bW / 2, badgeY);

        // Customized badge
        const cText = 'CUSTOMIZED';
        const cMetrics = g.measureText(cText);
        const cPad = isPoster ? 10 : 7;
        const cW = cMetrics.width + cPad * 2;
        const cH = isPoster ? 28 : 22;
        let cX = splitX + (isPoster ? 14 : 10);
        if (cX + cW > maxW - 8) cX = maxW - cW - 8;
        if (cX < splitX + 2) cX = splitX + 2;

        g.fillStyle = 'rgba(22, 6, 9, 0.88)';
        g.strokeStyle = '#6e1d27';
        g.lineWidth = 1;
        g.beginPath();
        if (g.roundRect) g.roundRect(cX, badgeY - cH / 2, cW, cH, 999);
        else g.rect(cX, badgeY - cH / 2, cW, cH);
        g.fill();
        g.stroke();

        g.fillStyle = '#FF7588';
        g.fillText(cText, cX + cW / 2, badgeY);

        g.restore();
      }

      drawCaret(B, now, col) {
        const S = this.Sd, on = now - this.lastKey < 500 || Math.floor(now / 530) % 2 === 0, hf = this.eo((now - this.t0) / 600);
        if (on && hf > 0) {
          const h = 0.8 * S * hf, w = Math.max(2, S * 0.03);
          B.rect(this.cx - w / 2, this.cy - h / 2, w, h, col);
        }
      }

      renderPosterTreatment(g, B, timeVal, st, pal) {
        const treatment = this.state.treatment || 'split';
        if (treatment === 'baseline') {
          this.render(B, timeVal, st);
        } else if (treatment === 'customized') {
          const stCustom = {
            ...st,
            C: { red: '#C41A30', blue: '#1C4528', line: '#F07082', text: '#FFFFFF', vein: '#000000' }
          };
          this.renderCustomized(B, timeVal, stCustom);
        } else {
          // Split View: side-by-side comparison on 1080x1080
          const splitX = Math.round(1080 * this.splitPos);

          // Left side: Baseline
          g.save();
          g.beginPath();
          g.rect(0, 0, splitX, 1080);
          g.clip();
          g.fillStyle = pal.bg;
          g.fillRect(0, 0, 1080, 1080);
          this.render(B, timeVal, st);
          g.restore();

          // Right side: Customized
          g.save();
          g.beginPath();
          g.rect(splitX, 0, 1080 - splitX, 1080);
          g.clip();
          g.fillStyle = '#000000';
          g.fillRect(0, 0, 1080, 1080);
          const stCustom = {
            ...st,
            C: { red: '#C41A30', blue: '#1C4528', line: '#F07082', text: '#FFFFFF', vein: '#000000' }
          };
          this.renderCustomized(B, timeVal, stCustom);
          g.restore();

          // Divider and Badges
          this.drawSplitDivider(g, splitX, 1080, true);
        }
      }

      // ---------- Poster Mode Engine ----------
      preset() { return this.PRESETS.find(p => p.id === this.state.preset) || this.PRESETS[0]; }

      buildPoster() {
        if (!this.pcv) return;
        const s = this.state, pr = this.preset(), text = (s.text || '').slice(0, 40) || ' ';
        this.rand = this.rng(s.seed * 7919 + 1);
        const L = []; let prev = null, uid = 1;
        for (const ch of text) {
          if (ch === ' ') { const sp = { ch: ' ', id: 9000 + uid++, els: [] }; L.push(sp); prev = sp; continue; }
          const same = prev && prev.ch !== ' ';
          const l = { ch, id: 9000 + uid++, ws: same ? prev.ws : Math.floor(this.rand() * 1e9), wi: same ? prev.wi + 1 : 0, prev: same ? prev : null };
          this.gen(l); L.push(l); prev = l;
        }

        // Generate end flourishes for word ends
        L.forEach((l, i) => {
          const nx = L[i + 1];
          if (l.ch !== ' ' && (!nx || nx.ch === ' ')) {
            this.genEnd(l, 0);
          }
        });

        const res = this.layoutCore(L, 1080, 1080, false);
        L.forEach(l => {
          l.x = l.tx;
          l.y = l.ty;
          l.birth = 0;
          l.tb = 0;
        });

        this.posterLetters = L;
        this.posterS = res.S;
        this.pt0 = performance.now();
      }

      posterDraw(g, elapsed) {
        const pal = this.pal();
        const isCustom = this.state.treatment === 'customized';
        g.setTransform(1, 0, 0, 1, 0, 0);
        g.fillStyle = isCustom ? '#000000' : pal.bg;
        g.fillRect(0, 0, 1080, 1080);

        const B = this.backend(g);
        const pr = this.preset();
        const duration = pr.T;
        const u = (elapsed % duration) / duration;
        const S = this.posterS;

        if (pr.id === 'breathe') {
          const ph = u * Math.PI * 2;
          const st = {
            letters: this.posterLetters,
            S,
            C: pal.C,
            boil: true,
            recoil: 20,
            speed: 1,
            wither: 260,
            face: false,
            warp: (x, y, l) => {
              const hh = Math.max(0, (l.y - y) / S);
              return [
                x + Math.sin(ph) * S * 0.045 * hh,
                y + Math.cos(ph * 2) * S * 0.015 * hh
              ];
            },
            rotw: e => Math.sin(ph + e.id * 0.7) * 0.09
          };
          this.renderPosterTreatment(g, B, 10000 + elapsed, st, pal);
        } else if (pr.id === 'grow') {
          let k = u < 0.48 ? this.eo(u / 0.46) : 1 - this.eo((u - 0.54) / 0.46);
          k = Math.max(0, Math.min(1, k));
          const vAge = k * 3500;
          const letters = this.posterLetters.map(l => ({
            ...l,
            birth: 10000 - vAge,
            tb: 10000 - vAge,
            dead: k < 0.01 ? 10000 : null
          }));
          const st = {
            letters,
            S,
            C: pal.C,
            boil: true,
            recoil: 20,
            speed: 1,
            wither: 260,
            face: false
          };
          this.renderPosterTreatment(g, B, 10000, st, pal);
        } else if (pr.id === 'typed') {
          const n = this.posterLetters.length;
          const typeEnd = 0.72;
          const pauseEnd = 0.88;
          let count = u < typeEnd ? Math.floor((u / typeEnd) * (n + 1)) : n;
          const isWithering = u >= pauseEnd;
          const letters = this.posterLetters.slice(0, Math.min(n, count)).map((l, i) => {
            const appearU = (i / n) * typeEnd;
            const letterAge = u >= appearU ? (u - appearU) * duration : 0;
            return {
              ...l,
              birth: 10000 - letterAge,
              tb: 10000 - letterAge,
              dead: isWithering ? (10000 - (u - pauseEnd) * duration) : null
            };
          });
          const st = {
            letters,
            S,
            C: pal.C,
            boil: true,
            recoil: 20,
            speed: 1,
            wither: 500,
            face: false
          };
          this.renderPosterTreatment(g, B, 10000, st, pal);
        } else if (pr.id === 'wind') {
          const gustX = -200 + u * 1480;
          const st = {
            letters: this.posterLetters,
            S,
            C: pal.C,
            boil: true,
            recoil: 20,
            speed: 1,
            wither: 260,
            face: false,
            warp: (x, y, l) => {
              const hh = Math.max(0, (l.y - y) / S);
              const dist = (x - gustX) / (S * 1.5);
              const gust = Math.exp(-dist * dist * 1.2);
              const flutter = Math.sin(elapsed * 0.03 + l.id) * 0.12;
              return [
                x + (gust * 0.32 + gust * flutter) * S * hh,
                y + (gust * 0.1 * Math.sin(elapsed * 0.025)) * S * hh
              ];
            },
            rotw: e => Math.sin(elapsed * 0.02 + e.id) * 0.14
          };
          this.renderPosterTreatment(g, B, 10000 + elapsed, st, pal);
        } else if (pr.id === 'reach') {
          const ang = u * Math.PI * 2;
          const lx = 540 + Math.cos(ang) * 360;
          const ly = 460 + Math.sin(ang * 2) * 240;
          const oldMx = this.mx, oldMy = this.my;
          this.mx = lx; this.my = ly;
          const st = {
            letters: this.posterLetters,
            S,
            C: pal.C,
            boil: true,
            recoil: 20,
            speed: 1,
            wither: 260,
            face: true
          };
          this.renderPosterTreatment(g, B, 10000 + elapsed, st, pal);
          const glow = g.createRadialGradient(lx, ly, 0, lx, ly, 24);
          glow.addColorStop(0, pal.C.line + 'bb');
          glow.addColorStop(1, pal.C.line + '00');
          g.fillStyle = glow;
          g.beginPath();
          g.arc(lx, ly, 24, 0, Math.PI * 2);
          g.fill();
          this.mx = oldMx; this.my = oldMy;
        } else if (pr.id === 'scatter') {
          const letters = this.posterLetters.map(l => {
            const off = this.h(l.id * 11.37);
            const lu = (u + off) % 1;
            const k = lu < 0.48 ? this.eo(lu / 0.48) : 1 - this.eo((lu - 0.52) / 0.48);
            const clampedK = Math.max(0, Math.min(1, k));
            const vAge = clampedK * 3200;
            return {
              ...l,
              birth: 10000 - vAge,
              tb: 10000 - vAge,
              dead: clampedK < 0.01 ? 10000 : null
            };
          });
          const st = {
            letters,
            S,
            C: pal.C,
            boil: true,
            recoil: 20,
            speed: 1,
            wither: 260,
            face: false
          };
          this.renderPosterTreatment(g, B, 10000, st, pal);
        } else if (pr.id === 'visit') {
          const st = {
            letters: this.posterLetters,
            S,
            C: pal.C,
            boil: true,
            recoil: 20,
            speed: 1,
            wither: 260,
            face: false,
            perchOn: true
          };
          this.renderPosterTreatment(g, B, 10000 + elapsed, st, pal);
          if (this.perch.length > 0) {
            const p = this.perch[this.perch.length - 1];
            const sz = Math.max(14, S * 0.11);
            let bx, by, ang = 0, open = 1;
            if (u < 0.24) {
              const f = u / 0.24;
              bx = -60 + (p.x - (-60)) * this.eo(f);
              by = 80 + (p.y - 0.55 * p.R - 80) * this.eo(f) + Math.sin(f * 12) * 18;
              ang = 0.2 * Math.sin(f * 8);
              open = Math.abs(Math.cos(f * 18));
            } else if (u < 0.72) {
              const f = (u - 0.24) / 0.48;
              bx = p.x + p.R * 0.05;
              by = p.y - p.R * 0.55;
              ang = 0.04 * Math.sin(f * 5);
              open = 0.22 + 0.65 * Math.abs(Math.cos(f * 14));
            } else {
              const f = (u - 0.72) / 0.28;
              bx = (p.x + p.R * 0.05) + (1160 - (p.x + p.R * 0.05)) * (f * f);
              by = (p.y - p.R * 0.55) - 320 * f + Math.sin(f * 14) * 16;
              ang = 0.25 + 0.1 * Math.sin(f * 6);
              open = Math.abs(Math.cos(f * 20));
            }
            this.butterfly(B, bx, by, sz, ang, open, pal.C);
          }
        }
      }

      // ---------- Export Tools ----------
      savePNG() {
        const c = this.state.mode === 'poster' ? this.pcv : this.cv;
        if (!c) return;
        const link = document.createElement('a');
        link.download = `type-garden-${Date.now()}.png`;
        link.href = c.toDataURL('image/png');
        link.click();
      }

      saveSVG() {
        const isPoster = this.state.mode === 'poster';
        const W = isPoster ? 1080 : this.W;
        const H = isPoster ? 1080 : this.H;
        const pal = this.pal();
        const treatment = this.state.treatment || 'split';
        const st = isPoster
          ? { letters: this.posterLetters, S: this.posterS, C: pal.C, boil: false, recoil: 20, speed: 1, wither: 260, face: false }
          : this.mainState();

        const svgElements = [];
        const svgBackend = {
          fill: (p, col) => {
            if (!p || p.length < 2) return;
            const d = this.pathToSvg(p, true);
            svgElements.push(`<path d="${d}" fill="${col}" />`);
          },
          stroke: (p, col, w) => {
            if (!p || p.length < 2) return;
            const d = this.pathToSvg(p, false);
            svgElements.push(`<path d="${d}" fill="none" stroke="${col}" stroke-width="${w.toFixed(2)}" stroke-linecap="round" stroke-linejoin="round" />`);
          },
          rect: (x, y, w, h, col) => {
            svgElements.push(`<rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${w.toFixed(2)}" height="${h.toFixed(2)}" fill="${col}" />`);
          },
          text: (ch, x, y, S, col) => {
            const esc = ch === '&' ? '&amp;' : ch === '<' ? '&lt;' : ch === '>' ? '&gt;' : ch;
            svgElements.push(`<text x="${x.toFixed(2)}" y="${y.toFixed(2)}" font-family="Playfair Display, Georgia, serif" font-weight="700" font-size="${S.toFixed(2)}" text-anchor="middle" dominant-baseline="alphabetic" fill="${col}">${esc}</text>`);
          }
        };

        if (treatment === 'customized') {
          svgElements.push(`<rect width="${W}" height="${H}" fill="#000000" />`);
          const stCustom = { ...st, C: { red: '#C41A30', blue: '#1C4528', line: '#F07082', text: '#FFFFFF', vein: '#000000' } };
          this.renderCustomized(svgBackend, performance.now(), stCustom);
        } else if (treatment === 'baseline') {
          svgElements.push(`<rect width="${W}" height="${H}" fill="${pal.bg}" />`);
          this.render(svgBackend, performance.now(), st);
        } else {
          const splitX = Math.round(W * this.splitPos);
          svgElements.push(`<defs>
  <clipPath id="clip-baseline"><rect x="0" y="0" width="${splitX}" height="${H}" /></clipPath>
  <clipPath id="clip-customized"><rect x="${splitX}" y="0" width="${W - splitX}" height="${H}" /></clipPath>
</defs>`);
          // Baseline left
          svgElements.push(`<g clip-path="url(#clip-baseline)">`);
          svgElements.push(`<rect width="${W}" height="${H}" fill="${pal.bg}" />`);
          this.render(svgBackend, performance.now(), st);
          svgElements.push(`</g>`);
          // Customized right
          svgElements.push(`<g clip-path="url(#clip-customized)">`);
          svgElements.push(`<rect width="${W}" height="${H}" fill="#000000" />`);
          const stCustom = { ...st, C: { red: '#C41A30', blue: '#1C4528', line: '#F07082', text: '#FFFFFF', vein: '#000000' } };
          this.renderCustomized(svgBackend, performance.now(), stCustom);
          svgElements.push(`</g>`);
          // Hairline divider
          svgElements.push(`<line x1="${splitX}" y1="0" x2="${splitX}" y2="${H}" stroke="rgba(255,255,255,0.3)" stroke-width="1" />`);
        }

        const svgDoc = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&amp;display=swap');
  text { font-family: 'Playfair Display', Georgia, serif; font-weight: 700; }
</style>
${svgElements.join('\n')}
</svg>`;

        const blob = new Blob([svgDoc], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `type-garden-${Date.now()}.svg`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      exportVideo() {
        if (this.state.busy) return;
        const canvas = this.pcv;
        if (!canvas) return;
        const pr = this.preset();
        const durationMs = pr.T;
        const mime = this.vmime;

        if (!mime || typeof MediaRecorder === 'undefined' || !canvas.captureStream) {
          this.statusEl.textContent = 'Video export not supported in this browser; use PNG frames';
          return;
        }

        const ext = mime.includes('mp4') ? 'mp4' : 'webm';
        this.state.busy = true;
        this.statusEl.textContent = 'Recording 1080×1080 loop...';

        try {
          const stream = canvas.captureStream(30);
          const recorder = new MediaRecorder(stream, { mimeType: mime });
          const chunks = [];

          recorder.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };
          recorder.onstop = () => {
            const blob = new Blob(chunks, { type: mime });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `type-garden-${pr.id}.${ext}`;
            a.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            this.state.busy = false;
            this.statusEl.textContent = 'Video export complete';
            setTimeout(() => { if (!this.state.busy) this.statusEl.textContent = ''; }, 4000);
          };

          this.pt0 = performance.now();
          recorder.start();
          setTimeout(() => {
            if (recorder.state !== 'inactive') recorder.stop();
          }, durationMs);
        } catch (err) {
          this.state.busy = false;
          this.statusEl.textContent = 'Recording error: ' + err.message;
        }
      }

      async exportFrames() {
        if (this.state.busy) return;
        const canvas = this.pcv;
        if (!canvas) return;
        const pr = this.preset();
        const durationMs = pr.T;
        const fps = 24;
        const totalFrames = Math.round((durationMs / 1000) * fps);

        this.state.busy = true;
        this.statusEl.textContent = 'Rendering frame 0/' + totalFrames + '...';

        const ctx = canvas.getContext('2d');
        const files = [];

        try {
          for (let i = 0; i < totalFrames; i++) {
            const t = (i / totalFrames) * durationMs;
            this.posterDraw(ctx, t);

            const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
            const arrayBuffer = await blob.arrayBuffer();
            const filename = `frame_${String(i).padStart(4, '0')}.png`;
            files.push({ name: filename, data: new Uint8Array(arrayBuffer) });

            if (i % 6 === 0 || i === totalFrames - 1) {
              const pct = Math.round(((i + 1) / totalFrames) * 100);
              this.statusEl.textContent = `Rendering frames: ${pct}%`;
              await new Promise(r => setTimeout(r, 0));
            }
          }

          this.statusEl.textContent = 'Packaging zip file...';
          await new Promise(r => setTimeout(r, 20));

          const zipBlob = this.createZip(files);
          const url = URL.createObjectURL(zipBlob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `type-garden-${pr.id}-frames.zip`;
          a.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);

          this.state.busy = false;
          this.statusEl.textContent = 'ZIP export complete';
          setTimeout(() => { if (!this.state.busy) this.statusEl.textContent = ''; }, 4000);
        } catch (err) {
          this.state.busy = false;
          this.statusEl.textContent = 'Frame export error: ' + err.message;
        }
      }

      // Self-contained standard uncompressed ZIP generator
      createZip(files) {
        const crcTable = new Uint32Array(256);
        for (let i = 0; i < 256; i++) {
          let c = i;
          for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
          crcTable[i] = c >>> 0;
        }
        function crc32(buf) {
          let crc = 0xFFFFFFFF;
          for (let i = 0; i < buf.length; i++) crc = (crc >>> 8) ^ crcTable[(crc ^ buf[i]) & 0xFF];
          return (crc ^ 0xFFFFFFFF) >>> 0;
        }

        const parts = [];
        const centralDir = [];
        let offset = 0;

        for (const file of files) {
          const nameBytes = new TextEncoder().encode(file.name);
          const data = file.data;
          const crc = crc32(data);
          const size = data.length;

          const header = new Uint8Array(30 + nameBytes.length);
          const view = new DataView(header.buffer);
          view.setUint32(0, 0x04034b50, true);
          view.setUint16(4, 20, true);
          view.setUint16(6, 0, true);
          view.setUint16(8, 0, true);
          view.setUint16(10, 0, true);
          view.setUint16(12, 0, true);
          view.setUint32(14, crc, true);
          view.setUint32(18, size, true);
          view.setUint32(22, size, true);
          view.setUint16(26, nameBytes.length, true);
          view.setUint16(28, 0, true);
          header.set(nameBytes, 30);

          parts.push(header, data);

          const cd = new Uint8Array(46 + nameBytes.length);
          const cdView = new DataView(cd.buffer);
          cdView.setUint32(0, 0x02014b50, true);
          cdView.setUint16(4, 20, true);
          cdView.setUint16(6, 20, true);
          cdView.setUint16(8, 0, true);
          cdView.setUint16(10, 0, true);
          cdView.setUint16(12, 0, true);
          cdView.setUint16(14, 0, true);
          cdView.setUint32(16, crc, true);
          cdView.setUint32(20, size, true);
          cdView.setUint32(24, size, true);
          cdView.setUint16(28, nameBytes.length, true);
          cdView.setUint16(30, 0, true);
          cdView.setUint16(32, 0, true);
          cdView.setUint16(34, 0, true);
          cdView.setUint16(36, 0, true);
          cdView.setUint32(38, 0, true);
          cdView.setUint32(42, offset, true);
          cd.set(nameBytes, 46);

          centralDir.push(cd);
          offset += header.length + size;
        }

        const cdOffset = offset;
        let cdSize = 0;
        for (const cd of centralDir) cdSize += cd.length;

        const eocd = new Uint8Array(22);
        const eocdView = new DataView(eocd.buffer);
        eocdView.setUint32(0, 0x06054b50, true);
        eocdView.setUint16(4, 0, true);
        eocdView.setUint16(6, 0, true);
        eocdView.setUint16(8, files.length, true);
        eocdView.setUint16(10, files.length, true);
        eocdView.setUint32(12, cdSize, true);
        eocdView.setUint32(16, cdOffset, true);
        eocdView.setUint16(20, 0, true);

        return new Blob([...parts, ...centralDir, eocd], { type: 'application/zip' });
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      window.__typeGarden = new TypeGardenApp();
    });
  })();
  </script>
